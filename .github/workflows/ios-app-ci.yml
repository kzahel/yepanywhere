name: iOS App CI

on:
  # Shared web/server and lockfile changes are covered by nightly runs.
  push:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - 'packages/mobile-core/**'
      - 'packages/mobile-core-proof/test-vectors/**'
      - 'packages/client/src/lib/nativeHost.ts'
      - 'packages/client/src/lib/transport/NativeSourceTransport.ts'
      - 'packages/client/src/lib/nativeTransportBridge.ts'
      - 'packages/client/src/lib/__tests__/nativeHost.test.ts'
      - 'packages/server/src/crypto/**'
      - 'packages/shared/src/binary-framing.ts'
      - 'packages/server/scripts/android-native-secure-probe-server.ts'
      - 'scripts/android-secure-interop-fixture.ts'
      - 'pnpm-workspace.yaml'
      - 'packages/android/app/src/sharedTest/resources/**'
      - 'scripts/perf-suite/host-profile.mjs'
      - '.github/workflows/ios-app-ci.yml'
      - '!packages/ios/**/*.md'
      - '!packages/mobile-core/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/ios/**'
      - 'packages/mobile-core/**'
      - 'packages/mobile-core-proof/test-vectors/**'
      - 'packages/client/src/lib/nativeHost.ts'
      - 'packages/client/src/lib/transport/NativeSourceTransport.ts'
      - 'packages/client/src/lib/nativeTransportBridge.ts'
      - 'packages/client/src/lib/__tests__/nativeHost.test.ts'
      - 'packages/server/src/crypto/**'
      - 'packages/shared/src/binary-framing.ts'
      - 'packages/server/scripts/android-native-secure-probe-server.ts'
      - 'scripts/android-secure-interop-fixture.ts'
      - 'pnpm-workspace.yaml'
      - 'packages/android/app/src/sharedTest/resources/**'
      - 'scripts/perf-suite/host-profile.mjs'
      - '.github/workflows/ios-app-ci.yml'
      - '!packages/ios/**/*.md'
      - '!packages/mobile-core/**/*.md'
  schedule:
    - cron: '47 4 * * *'
  workflow_dispatch:
    inputs:
      testflight:
        description: Cloud-sign and deliver this passing main build to the Internal group
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ios-app-${{ github.workflow }}-${{ github.ref }}-${{ inputs.testflight && 'publish' || 'verify' }}
  cancel-in-progress: ${{ !inputs.testflight }}

jobs:
  verify-ios-app:
    outputs:
      attempt: ${{ steps.archive.outputs.attempt }}
      build_number: ${{ steps.archive.outputs.build_number }}
    name: Rust, simulator, and device archive
    # The older runtime settled on arm64; its prior memory rejection measured
    # free pages rather than availability. Intel remained CPU-bound without video.
    # Retain all tests/gates, the simulator profile and corrected memory sampler.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      YA_IOS_SIMULATOR_VERSION: '18.6'
      YA_IOS_SIMULATOR_PROFILE: input-acceptance
    # Cold Intel run 36898374886 took 42 minutes before UI/device acceptance.
    # Allow ~2x that measured elapsed time for all gates; input stays at 100ms.
    timeout-minutes: 90
    steps:
      - name: Disable indexing on the disposable measurement host
        # The failed headroom samples also show mds/mdworker contention.
        # This is an ephemeral hosted VM, never a developer's workstation.
        run: sudo mdutil -a -i off
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned native tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain 1.97.0 aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          curl -fLsS https://github.com/yonaskolb/XcodeGen/releases/download/2.45.3/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          echo "0c90f4d28ca57335f9fa78cf5bf6dabfe20a232036dabe36de2eef79cb7c0878  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/ya-xcodegen"
          echo "$RUNNER_TEMP/ya-xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Verify Rust profile and resource ownership
        run: node packages/mobile-core/scripts/run.mjs rust
      - name: Verify unchanged server and relay routes
        run: |
          node packages/mobile-core/scripts/live.mjs
          pnpm exec tsx --conditions source packages/mobile-core/scripts/live-relay.ts
      - name: Verify native bridge and exhaustive reconnection behavior
        env:
          YA_RECOVERY_CONFORMANCE_DEPTH: 5
        run: pnpm --filter @yep-anywhere/client exec vitest run nativeHost.test NativeSourceTransport.test recoveryConformance ReconnectSubscriptions ArtifactPreview.test
      - name: Build and test on an owned simulator
        run: node packages/ios/scripts/run.mjs test
      - name: Prepare the TestFlight app configuration
        if: inputs.testflight && github.ref == 'refs/heads/main'
        env:
          FIREBASE_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          test -n "$FIREBASE_PLIST"
          mkdir -p packages/ios/Config
          printf %s "$FIREBASE_PLIST" | base64 -D > packages/ios/Config/GoogleService-Info.plist
      - name: Link an unsigned physical-device build
        run: node packages/ios/scripts/run.mjs build
      - name: Upload simulator evidence and unsigned app
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-app-build-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            packages/ios/build/*.xcresult
            packages/ios/build/host-*.json
            packages/ios/build/DerivedData/Build/Products/Release-iphoneos/YepAnywhere.app

      - name: Archive the verified device release
        id: archive
        if: inputs.testflight && github.ref == 'refs/heads/main'
        working-directory: packages/ios
        run: |
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "build_number=$((GITHUB_RUN_NUMBER + 1)).$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          xcodebuild -project YepAnywhere.xcodeproj -scheme YepAnywhere \
            -configuration Release -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData -archivePath "$RUNNER_TEMP/YepAnywhere.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$((GITHUB_RUN_NUMBER + 1)).$GITHUB_RUN_ATTEMPT" archive
          ditto -c -k --keepParent "$RUNNER_TEMP/YepAnywhere.xcarchive" "$RUNNER_TEMP/ios-candidate.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.testflight && github.ref == 'refs/heads/main'
        with:
          name: ios-testflight-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-candidate.zip
          retention-days: 3

  testflight:
    outputs:
      version: ${{ steps.upload.outputs.version }}
      sha256: ${{ steps.upload.outputs.sha256 }}
    name: Sign and upload the tested archive
    if: inputs.testflight && github.ref == 'refs/heads/main'
    needs: verify-ios-app
    runs-on: macos-15
    environment: ios-testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ios-testflight-candidate-${{ needs.verify-ios-app.outputs.attempt }}
          path: ${{ runner.temp }}
      - name: Cloud-sign, verify production push entitlements and upload
        id: upload
        env:
          IOS_ASC_APP_ID: ${{ vars.IOS_ASC_APP_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_ARCHIVE_PATH: ${{ runner.temp }}/YepAnywhere.xcarchive
          IOS_BUILD_NUMBER: ${{ needs.verify-ios-app.outputs.build_number }}
        run: |
          ditto -x -k "$RUNNER_TEMP/ios-candidate.zip" "$RUNNER_TEMP"
          node packages/ios/scripts/testflight.mjs upload

  verify-internal:
    name: Verify Apple processing and tester group
    needs: [verify-ios-app, testflight]
    runs-on: ubuntu-latest
    environment: ios-testflight
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify delivery
        env:
          IOS_ASC_APP_ID: ${{ vars.IOS_ASC_APP_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          IOS_BUILD_NUMBER: ${{ needs.verify-ios-app.outputs.build_number }}
          IOS_VERSION: ${{ needs.testflight.outputs.version }}
          IOS_IPA_SHA256: ${{ needs.testflight.outputs.sha256 }}
          IOS_DELIVERY_RECEIPT: ${{ runner.temp }}/ios-delivery.json
        run: node packages/ios/scripts/testflight.mjs verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-testflight-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-delivery.json
