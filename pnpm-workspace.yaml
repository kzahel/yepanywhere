packages:
  - "packages/*"

# scripts/biome.cjs intentionally uses Biome's static musl binary on Linux so
# lint and formatting also work on hosts with an older glibc. pnpm otherwise
# installs only the current libc's optional package.
supportedArchitectures:
  libc:
    - current
    - musl

# pnpm settings live here, not under a "pnpm" key in package.json: pnpm 11
# stopped reading that key, and a pnpm 11 invocation of an install in this
# repo reports all three of these as ignored. Silently losing
# onlyBuiltDependencies would re-enable arbitrary dependency install scripts,
# so keep them where every supported pnpm reads them. Rationale for the
# individual entries is in docs/development/dependencies.md
# ("Dependency Security Maintenance").
overrides:
  "bn.js": "5.2.5"
  "fast-uri": "3.1.9"
  "postcss": "^8.5.23"
  "jsdom>ws": "^8.21.3"
  "mermaid>katex": "^0.18.6"

onlyBuiltDependencies:
  - bcrypt

# Vetted no-op build scripts, blocked on purpose. Listing them records that
# decision, so installs stop warning and `pnpm approve-builds` stays empty.
ignoredBuiltDependencies:
  - "@firebase/util"
  - esbuild
  - protobufjs

auditConfig:
  ignoreGhsas:
    - GHSA-qwww-vcr4-c8h2
    - GHSA-w5hq-g745-h8pq
