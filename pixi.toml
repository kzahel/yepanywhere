[workspace]
name = "yepanywhere"
channels = ["conda-forge"]
platforms = ["linux-64"]

[environments]
stt = { features = ["stt"] }
stt-nemo = { features = ["stt", "nemo-recent"] }
stt-whisper-gpu = { features = ["stt", "whisper-gpu"] }

[feature.stt.dependencies]
python = ">=3.11,<3.13"
pip = ">=25"
ffmpeg = ">=7"

[feature.stt.tasks]
stt-install = "python -m pip install --requirement requirements/stt.txt"
stt-install-parakeet = "python -m pip install --requirement requirements/stt-parakeet.txt"
stt-install-granite = "python -m pip install --requirement requirements/stt-granite.txt"
stt-install-qwen = "python -m pip install --requirement requirements/stt-qwen.txt"
stt-check-qwen = "python -c \"from transformers import Qwen3ASRForConditionalGeneration, Qwen3ASRProcessor; print('qwen ASR import OK')\""
stt-bootstrap-qwen = { depends-on = ["stt-install-qwen", "stt-check-qwen"] }
stt-check = "python -c \"from faster_whisper import WhisperModel; print('faster-whisper import OK')\""
stt-check-parakeet = "python -c \"import torch; from transformers import pipeline; print('parakeet transformers import OK')\""
stt-check-granite = "python -c \"import torchaudio, peft; from transformers import GraniteSpeechForConditionalGeneration; print('granite speech transformers import OK')\""
stt-bootstrap = { depends-on = ["stt-install", "stt-check"] }
stt-bootstrap-parakeet = { depends-on = ["stt-install-parakeet", "stt-check-parakeet"] }
stt-bootstrap-granite = { depends-on = ["stt-install-granite", "stt-check-granite"] }
stt-bootstrap-all = { depends-on = ["stt-bootstrap", "stt-bootstrap-parakeet"] }

[feature.nemo-recent.tasks]
nemo-install = "python -m pip install --requirement requirements/stt-nemo-recent.txt"
nemo-check = "python -c \"from nemo.collections.asr.models import ASRModel; print('NeMo ASR import OK')\""
nemo-bootstrap = { depends-on = ["nemo-install", "nemo-check"] }

[feature.whisper-gpu.tasks]
whisper-gpu-install = "python -m pip install --requirement requirements/stt-whisper-gpu.txt"
whisper-gpu-check = "python -c \"from faster_whisper import WhisperModel; import nvidia.cublas.lib, nvidia.cudnn.lib; print('Whisper CUDA libraries installed')\""
whisper-gpu-bootstrap = { depends-on = ["whisper-gpu-install", "whisper-gpu-check"] }
